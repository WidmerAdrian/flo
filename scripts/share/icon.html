<!doctype html>
<!-- App and browser icon: the logo on a transparent background, rendered at several sizes by scripts/share/render.cjs
     (which sets the logo width per size and puts the apple-touch-icon on white, since iOS fills transparency black) -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; display: grid; place-items: center; }
  img { width: 88%; }
</style></head><body><img src="../../public/assets/straehl-logo.png"></body></html>
